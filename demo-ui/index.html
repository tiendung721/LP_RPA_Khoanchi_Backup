<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c3a">
  <title>Demo giao diện · Trợ lý dữ liệu quyết toán</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Điều hướng chính">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M9 10h15l7 7v13H9z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M23 10v8h8M14 24l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div><strong>Quyết toán</strong><span>Trợ lý dữ liệu</span></div>
      </div>
      <div class="sidebar-label">ĐIỀU HƯỚNG</div>
      <nav id="navigation" class="nav-list">
        <button class="nav-item active" data-page="overview" type="button"><span class="nav-icon" aria-hidden="true">▦</span><span>Thao tác</span></button>
        <button class="nav-item" data-page="history" type="button"><span class="nav-icon" aria-hidden="true">◷</span><span>Lịch sử</span></button>
        <button class="nav-item" data-page="settings" type="button"><span class="nav-icon" aria-hidden="true">⚙</span><span>Cài đặt</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="system-card"><span class="status-dot"></span><div><strong>Ứng dụng sẵn sàng</strong><small>Dữ liệu mẫu để xem thiết kế</small></div></div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left"><span class="topbar-path">Trợ lý dữ liệu quyết toán</span><span class="topbar-divider">/</span><strong id="breadcrumb-current">Thao tác</strong></div>
        <div class="topbar-right"><span class="demo-badge"><span></span> BẢN DEMO · DỮ LIỆU MINH HỌA</span><div class="avatar" aria-label="Người dùng minh họa">KT</div></div>
      </header>
      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
</body>
</html>
